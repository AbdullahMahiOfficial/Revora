apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: pg-full-backup-manual
  namespace: postgres-ha
spec:
  method: barmanObjectStore
  cluster:
    name: pg-ha-cluster
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-scheduled-backup
  namespace: postgres-ha
spec:
  schedule: "0 0 0 * * *"
  method: barmanObjectStore
  cluster:
    name: pg-ha-cluster
  immediate: true