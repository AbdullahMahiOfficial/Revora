apiVersion: v1
kind: Namespace
metadata:
  name: postgres-ha
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-ha-cluster
  namespace: postgres-ha
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  storage:
    size: 10Gi
    storageClass: managed-csi

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"

  bootstrap:
    initdb:
      database: revoradb
      owner: revora_admin

  monitoring:
    enablePodMonitor: false